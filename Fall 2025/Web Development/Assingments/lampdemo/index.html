<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMP Demo - Random Users</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        h1 { text-align: center; color: #333; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #ddd; }
        button { padding: 8px 16px; margin: 10px 0; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #45a049; }
        form { margin-top: 20px; }
        input { padding: 6px; margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Random User Data</h1>

    <button onclick="fetchRandomUser()">Load Random User</button>

    <table id="userTable">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Country</th>
                <th>Email</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <form id="addForm" action="add.php" method="POST">
        <input type="text" name="first" placeholder="First Name" required>
        <input type="text" name="last" placeholder="Last Name" required>
        <input type="text" name="country" placeholder="Country" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="number" name="age" placeholder="Age" required>
        <button type="submit">Add User</button>
    </form>

    <script>
        async function fetchRandomUser() {
            const response = await fetch('https://randomuser.me/api/');
            const data = await response.json();
            const user = data.results[0];

            // Populate table
            const tableBody = document.querySelector("#userTable tbody");
            tableBody.innerHTML = "";
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${user.name.first}</td>
                <td>${user.name.last}</td>
                <td>${user.location.country}</td>
                <td>${user.email}</td>
                <td>${user.dob.age}</td>
            `;
            tableBody.appendChild(row);

            // Fill form inputs for easy submission
            document.querySelector('input[name="first"]').value = user.name.first;
            document.querySelector('input[name="last"]').value = user.name.last;
            document.querySelector('input[name="country"]').value = user.location.country;
            document.querySelector('input[name="email"]').value = user.email;
            document.querySelector('input[name="age"]').value = user.dob.age;
        }
    </script>
</body>
</html>
